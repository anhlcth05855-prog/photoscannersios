name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build PhotoScanner (iOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build & Archive iOS (Unsigned)
        run: |
          xcodebuild clean archive \
            -project PhotoScanner.xcodeproj \
            -scheme PhotoScanner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PhotoScanner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/PhotoScanner.xcarchive/Products/Applications/PhotoScanner.app build/Payload/
          cd build && zip -r PhotoScanner-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoScanner-unsigned-ipa
          path: build/PhotoScanner-unsigned.ipa
          retention-days: 14
